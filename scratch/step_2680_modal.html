                    <input type="text" id="edit-halaman-judul" name="judul" required class="w-full text-xs sm:text-sm border border-slate-300 rounded-xl px-3.5 py-2.5 focus:outline-blue-600 font-semibold text-slate-800">
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="block text-xs font-bold text-slate-700">Isi Konten Halaman (HTML / Teks) *</label>
                        <!-- Quick Insert Helper Buttons -->
                        <div class="flex items-center gap-1.5 text-[11px]">
                            <span class="text-slate-400 hidden sm:inline text-[10px]">Sisip Cepat:</span>

                            <button type="button" onclick="insertTagHalaman('strong')" class="px-2 py-0.5 rounded bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-[10px]" title="Tebal (Bold)">B</button>
                            <button type="button" onclick="insertTagHalaman('em')" class="px-2 py-0.5 rounded bg-slate-100 hover:bg-slate-200 text-slate-700 italic font-bold text-[10px]" title="Miring (Italic)">I</button>
                            <button type="button" onclick="insertTagHalaman('box')" class="px-2 py-0.5 rounded bg-amber-50 hover:bg-amber-100 text-amber-800 font-bold text-[10px]" title="Kotak Sorot">Kotak Sorot</button>
                        </div>
                    </div>
                    <textarea id="edit-halaman-konten" name="konten" rows="13" required class="w-full text-xs font-mono border border-slate-300 rounded-xl p-3.5 focus:outline-blue-600 leading-relaxed bg-slate-50/50 text-slate-800" placeholder="Tuliskan isi informasi halaman..."></textarea>
                    <p class="text-[11px] text-slate-400 mt-1 flex items-center gap-1">
                        <i class="fa-solid fa-circle-info text-blue-500"></i>
                        <span>Mendukung teks biasa maupun tag HTML seperti &lt;p&gt;, &lt;strong&gt;, &lt;ol&gt;, &lt;li&gt;, serta styling Tailwind CSS.</span>
                    </p>
                </div>

                <div class="flex items-center justify-between pt-4 border-t border-slate-100">
                    <button type="button" onclick="previewCurrentEdit()" class="px-4 py-2 text-xs font-bold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-xl transition flex items-center gap-1.5 cursor-pointer">

                    </button>
                    <div class="flex items-center gap-2">

                        <button type="submit" class="px-5 py-2 text-xs font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-xl shadow transition flex items-center gap-1.5 cursor-pointer">
                            <i class="fa-solid fa-floppy-disk"></i>
                            <span>Simpan Perubahan</span>
                        </button>
                    </div>
                </div>
            </form>
        </div>

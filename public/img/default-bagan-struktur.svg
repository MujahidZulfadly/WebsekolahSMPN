<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" style="background:#0b132b; font-family:'Plus Jakarta Sans', Poppins, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cardGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGradAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title Header Banner -->
  <rect x="50" y="30" width="1100" height="90" rx="16" fill="url(#headerGrad)" stroke="#3b82f6" stroke-width="1.5" filter="url(#cardShadow)"/>
  <circle cx="100" cy="75" r="28" fill="url(#goldGrad)"/>
  <text x="100" y="83" font-size="22" font-weight="900" fill="#0b132b" text-anchor="middle">S1</text>
  <text x="150" y="68" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="0.5">STRUKTUR ORGANISASI UPT SMP NEGERI 1 RANTEPAO</text>
  <text x="150" y="93" font-size="13" font-weight="600" fill="#fbbf24" letter-spacing="1">BAGAN TATA KELOLA &amp; KOORDINASI KEPEMIMPINAN SEKOLAH • TAHUN AJARAN 2025/2026</text>

  <!-- Connector Lines -->
  <!-- Line from Kepsek down -->
  <path d="M 600 230 L 600 360" stroke="#f59e0b" stroke-width="3" stroke-dasharray="0" fill="none"/>
  <!-- Line between Kepsek and Komite (Coordination / Dashed) -->
  <path d="M 450 190 L 320 190" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6,4" fill="none"/>
  <text x="385" y="180" font-size="10" font-weight="700" fill="#cbd5e1" text-anchor="middle">GARIS KOORDINASI</text>
  
  <!-- Line between Kepsek and Tata Usaha -->
  <path d="M 750 190 L 880 190" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
  <text x="815" y="180" font-size="10" font-weight="700" fill="#cbd5e1" text-anchor="middle">GARIS KOMANDO</text>

  <!-- Horizontal Distribution Line to Wakasek -->
  <path d="M 180 360 L 1020 360" stroke="#f59e0b" stroke-width="3" fill="none"/>
  <!-- Drops to each 4 Wakasek -->
  <path d="M 180 360 L 180 410" stroke="#f59e0b" stroke-width="3" fill="none"/>
  <path d="M 460 360 L 460 410" stroke="#f59e0b" stroke-width="3" fill="none"/>
  <path d="M 740 360 L 740 410" stroke="#f59e0b" stroke-width="3" fill="none"/>
  <path d="M 1020 360 L 1020 410" stroke="#f59e0b" stroke-width="3" fill="none"/>

  <!-- Drops from Wakasek to Units below -->
  <path d="M 180 500 L 180 570" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
  <path d="M 460 500 L 460 570" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
  <path d="M 740 500 L 740 570" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
  <path d="M 1020 500 L 1020 570" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" fill="none"/>

  <!-- TOP LEVEL: KEPALA SEKOLAH (CENTER) -->
  <g filter="url(#cardShadow)">
    <rect x="450" y="150" width="300" height="90" rx="14" fill="url(#cardGradAccent)" stroke="#f59e0b" stroke-width="2.5"/>
    <rect x="450" y="150" width="300" height="26" rx="14" fill="#f59e0b"/>
    <text x="600" y="168" font-size="12" font-weight="900" fill="#0b132b" text-anchor="middle" letter-spacing="1">KEPALA SEKOLAH</text>
    <text x="600" y="200" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">Febry Anita R, S.T</text>
    <text x="600" y="222" font-size="11" font-weight="500" fill="#93c5fd" text-anchor="middle">NIP. 196801011994121001</text>
  </g>

  <!-- KOMITE SEKOLAH (LEFT) -->
  <g filter="url(#cardShadow)">
    <rect x="100" y="150" width="220" height="85" rx="12" fill="url(#cardGradPrimary)" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="4,2"/>
    <rect x="100" y="150" width="220" height="24" rx="12" fill="#d97706"/>
    <text x="210" y="166" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">KOMITE SEKOLAH</text>
    <text x="210" y="196" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Drs. Yulius Rantetana, M.Si.</text>
    <text x="210" y="217" font-size="10" font-weight="500" fill="#fcd34d" text-anchor="middle">Ketua Komite Sekolah</text>
  </g>

  <!-- KEPALA TATA USAHA (RIGHT) -->
  <g filter="url(#cardShadow)">
    <rect x="880" y="150" width="220" height="85" rx="12" fill="url(#cardGradPrimary)" stroke="#38bdf8" stroke-width="1.8"/>
    <rect x="880" y="150" width="220" height="24" rx="12" fill="#0284c7"/>
    <text x="990" y="166" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">KEPALA TATA USAHA</text>
    <text x="990" y="196" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Semuel Banne, S.Sos.</text>
    <text x="990" y="217" font-size="10" font-weight="500" fill="#bae6fd" text-anchor="middle">NIP. 19760218 200604 1 007</text>
  </g>

  <!-- 4 WAKIL KEPALA SEKOLAH -->
  <!-- 1. Wakasek Kurikulum -->
  <g filter="url(#cardShadow)">
    <rect x="70" y="410" width="220" height="90" rx="12" fill="url(#cardGradPrimary)" stroke="#60a5fa" stroke-width="1.5"/>
    <rect x="70" y="410" width="220" height="24" rx="12" fill="#2563eb"/>
    <text x="180" y="426" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">WAKASEK KURIKULUM</text>
    <text x="180" y="456" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Maria Rante, S.Pd.</text>
    <text x="180" y="476" font-size="10" font-weight="500" fill="#93c5fd" text-anchor="middle">NIP. 197504122005012004</text>
    <text x="180" y="491" font-size="9" font-weight="600" fill="#fbbf24" text-anchor="middle">Manajemen Pembelajaran</text>
  </g>

  <!-- 2. Wakasek Kesiswaan -->
  <g filter="url(#cardShadow)">
    <rect x="350" y="410" width="220" height="90" rx="12" fill="url(#cardGradPrimary)" stroke="#60a5fa" stroke-width="1.5"/>
    <rect x="350" y="410" width="220" height="24" rx="12" fill="#2563eb"/>
    <text x="460" y="426" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">WAKASEK KESISWAAN</text>
    <text x="460" y="456" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Damaris Salempang, S.Pd.</text>
    <text x="460" y="476" font-size="10" font-weight="500" fill="#93c5fd" text-anchor="middle">NIP. 19810322 200801 2 015</text>
    <text x="460" y="491" font-size="9" font-weight="600" fill="#fbbf24" text-anchor="middle">Pembinaan OSIS &amp; Eskul</text>
  </g>

  <!-- 3. Wakasek Sarpras -->
  <g filter="url(#cardShadow)">
    <rect x="630" y="410" width="220" height="90" rx="12" fill="url(#cardGradPrimary)" stroke="#60a5fa" stroke-width="1.5"/>
    <rect x="630" y="410" width="220" height="24" rx="12" fill="#2563eb"/>
    <text x="740" y="426" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">WAKASEK SARPRAS</text>
    <text x="740" y="456" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Daud Sapan, S.T.</text>
    <text x="740" y="476" font-size="10" font-weight="500" fill="#93c5fd" text-anchor="middle">NIP. 19781105 200902 1 004</text>
    <text x="740" y="491" font-size="9" font-weight="600" fill="#fbbf24" text-anchor="middle">Fasilitas &amp; Laboratorium</text>
  </g>

  <!-- 4. Wakasek Humas -->
  <g filter="url(#cardShadow)">
    <rect x="910" y="410" width="220" height="90" rx="12" fill="url(#cardGradPrimary)" stroke="#60a5fa" stroke-width="1.5"/>
    <rect x="910" y="410" width="220" height="24" rx="12" fill="#2563eb"/>
    <text x="1020" y="426" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">WAKASEK HUMAS</text>
    <text x="1020" y="456" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Martha Sampe, S.Pd.</text>
    <text x="1020" y="476" font-size="10" font-weight="500" fill="#93c5fd" text-anchor="middle">NIP. 19850419 201101 2 009</text>
    <text x="1020" y="491" font-size="9" font-weight="600" fill="#fbbf24" text-anchor="middle">Kemitraan &amp; Publikasi</text>
  </g>

  <!-- BOTTOM LEVEL: KOORDINATOR / UNIT PELAKSANA TEKNIS -->
  <!-- 1. Guru & Wali Kelas -->
  <g filter="url(#cardShadow)">
    <rect x="70" y="570" width="220" height="75" rx="10" fill="url(#cardGradPrimary)" stroke="#475569" stroke-width="1.2"/>
    <text x="180" y="600" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle">WALI KELAS &amp; GURU</text>
    <text x="180" y="622" font-size="10" font-weight="500" fill="#cbd5e1" text-anchor="middle">Tenaga Pendidik Mata Pelajaran</text>
  </g>

  <!-- 2. Pembina OSIS & Ekstrakurikuler -->
  <g filter="url(#cardShadow)">
    <rect x="350" y="570" width="220" height="75" rx="10" fill="url(#cardGradPrimary)" stroke="#475569" stroke-width="1.2"/>
    <text x="460" y="600" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle">PEMBINA OSIS &amp; ESKUL</text>
    <text x="460" y="622" font-size="10" font-weight="500" fill="#cbd5e1" text-anchor="middle">Pengembangan Bakat Siswa</text>
  </g>

  <!-- 3. Bimbingan Konseling (BK) -->
  <g filter="url(#cardShadow)">
    <rect x="630" y="570" width="220" height="75" rx="10" fill="url(#cardGradPrimary)" stroke="#475569" stroke-width="1.2"/>
    <text x="740" y="598" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle">BIMBINGAN KONSELING</text>
    <text x="740" y="618" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Elisabeth Palamba, S.Pd.</text>
    <text x="740" y="634" font-size="9" font-weight="500" fill="#93c5fd" text-anchor="middle">Koordinator BK / Konselor</text>
  </g>

  <!-- 4. Tenaga Administrasi & Lab -->
  <g filter="url(#cardShadow)">
    <rect x="910" y="570" width="220" height="75" rx="10" fill="url(#cardGradPrimary)" stroke="#475569" stroke-width="1.2"/>
    <text x="1020" y="600" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle">STAF ADMINISTRASI &amp; LAB</text>
    <text x="1020" y="622" font-size="10" font-weight="500" fill="#cbd5e1" text-anchor="middle">Laboran, Pustakawan &amp; Satpam</text>
  </g>

  <!-- Footer Watermark Bar -->
  <rect x="50" y="690" width="1100" height="70" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="75" y="730" font-size="12" font-weight="700" fill="#94a3b8">Kementerian Pendidikan Dasar dan Menengah • Dinas Pendidikan Kabupaten Toraja Utara</text>
  <text x="1125" y="730" font-size="12" font-weight="800" fill="#f59e0b" text-anchor="end">UPT SMP NEGERI 1 RANTEPAO • TERAKREDITASI A</text>
</svg>

